<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kategori - Mini Haber</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo">MiniHaber</a>
      <form id="searchForm" class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Haber ara..." required>
        <button type="submit" class="search-button">Ara</button>
      </form>
    </div>
  </header>

  <nav class="nav-categories">
    <ul id="categoriesNav" class="nav-container">
      <!-- Categories dynamically populated -->
    </ul>
  </nav>

  <main class="main-content">
    <h1 id="pageTitle" class="page-title">Kategori Haberleri</h1>
    <div id="newsGrid" class="news-grid">
      <!-- News cards populated dynamically -->
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2025 MiniHaber. Tüm hakları saklıdır.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
